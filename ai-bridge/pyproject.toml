[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-bridge"
version = "1.0.0"
description = "Universal AI-to-Tool bridge: MCP+A2A dual protocol gateway for CLI, Office, and Browser adapters"
readme = "../README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "AI-Bridge Team", email = "contact@ai-bridge.dev"}
]
keywords = [
    "ai", "automation", "mcp", "a2a", "gateway",
    "browser", "office", "cli", "playwright",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
office-win = [
    "pywin32>=306",
]
office-cross = [
    "python-docx>=1.0",
    "openpyxl>=3.1",
]
browser = [
    "playwright>=1.40.0",
]
media = [
    "ffmpeg-python>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-mock>=3.14",
    "pytest-timeout>=2.2",
    "ruff>=0.3",
    "mypy>=1.8",
    "pandas>=2.0",
]
all = [
    "ai-bridge[office-cross,browser,media,dev]",
]

[project.scripts]
aibridge = "aibridge.__main__:main"

[project.urls]
Homepage = "https://github.com/Louis830903/AI-Bridge"
Documentation = "https://ai-bridge.dev"
Repository = "https://github.com/Louis830903/AI-Bridge"
Issues = "https://github.com/Louis830903/AI-Bridge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aibridge"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "B",         # flake8-bugbear
    "C4",        # flake8-comprehensions
    "SIM",       # flake8-simplify
    "TCH",       # flake8-type-checking-imports
]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = false
lines-between-types = 1
known-first-party = ["aibridge"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/", "demos/", "examples/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
