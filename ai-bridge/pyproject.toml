[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-bridge"
version = "0.1.0"
description = "AI Application Interaction Protocol - Bridge AI Assistants to GUI Applications"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "AI-Bridge Team", email = "contact@ai-bridge.dev"}
]
keywords = [
    "ai", "automation", "mcp", "gui", "rpa", 
    "feishu", "dingtalk", "wecom", "wps", "office"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
office = [
    "pywin32>=306",
]
desktop = [
    "pywinauto>=0.6.8",
]
ocr = [
    "paddleocr>=2.7.0",
    "opencv-python>=4.8.0",
]
all = [
    "ai-bridge[browser,office,desktop,ocr]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
aibridge = "aibridge.__main__:main"

[project.urls]
Homepage = "https://github.com/Louis830903/AI-Bridge"
Documentation = "https://ai-bridge.dev"
Repository = "https://github.com/Louis830903/AI-Bridge"
Issues = "https://github.com/Louis830903/AI-Bridge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aibridge"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
