name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # 每天凌晨2点运行
    - cron: '0 2 * * *'

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install bandit safety semgrep
        pip install -e ".[dev]"
    
    - name: Run custom security auditor
      run: |
        python tools/security_auditor.py
      continue-on-error: true
    
    - name: Run Bandit Security Scan
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
    
    - name: Run Safety Dependency Check
      run: |
        safety check --json -o safety-report.json || true
    
    - name: Run Semgrep Analysis
      run: |
        semgrep --config=p/python --config=p/owasp-top-ten src/ --sarif -o semgrep-report.sarif || true
    
    - name: Upload Security Reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
          semgrep-report.sarif
          ai-bridge-security-report.json
    
    - name: Check for Critical Issues
      run: |
        # 如果 custom auditor 发现 P0 问题，标记失败
        if [ -f ai-bridge-security-report.json ]; then
          p0_count=$(python3 -c "import json; data=json.load(open('ai-bridge-security-report.json')); print(len([i for i in data['issues'] if i['level']=='P0']))")
          if [ "$p0_count" -gt 0 ]; then
            echo "❌ Found $p0_count P0 security issues!"
            exit 1
          fi
        fi
        echo "✅ No P0 security issues found"
