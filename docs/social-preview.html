<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI-Bridge Social Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1280px;
            height: 640px;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 40%, #0d1f3c 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
            position: relative;
        }
        
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 15% 85%, rgba(255, 107, 53, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 85% 15%, rgba(99, 102, 241, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.1) 0%, transparent 60%);
        }
        
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px;
        }
        
        .logo {
            font-size: 24px;
            font-family: 'Consolas', 'Monaco', monospace;
            color: #10b981;
            margin-bottom: 16px;
            letter-spacing: 3px;
        }
        
        h1 {
            font-size: 80px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #fff 0%, #10b981 40%, #6366f1 80%, #fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .tagline {
            font-size: 36px;
            color: #f8fafc;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .tagline-cn {
            font-size: 24px;
            color: #94a3b8;
            margin-bottom: 36px;
            font-weight: 300;
        }
        
        .features {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .feature {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 18px 28px;
            text-align: center;
            min-width: 180px;
        }
        
        .feature-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .feature-text {
            font-size: 18px;
            color: #e2e8f0;
            font-weight: 600;
        }
        
        .feature-sub {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }
        
        .badges {
            position: absolute;
            bottom: 28px;
            display: flex;
            gap: 16px;
        }
        
        .badge {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 14px;
            color: #94a3b8;
        }
        
        .badge-highlight {
            background: linear-gradient(90deg, #ff6b35, #f7931e);
            border: none;
            color: white;
            font-weight: 600;
        }
        
        .badge-mcp {
            background: linear-gradient(90deg, #10b981, #059669);
            border: none;
            color: white;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="content">
        <div class="logo">🌉 AI-BRIDGE</div>
        <h1>AI-Bridge</h1>
        <p class="tagline">From Chat to Action</p>
        <p class="tagline-cn">让 AI 从聊天走向行动</p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🌐</div>
                <div class="feature-text">Browser</div>
                <div class="feature-sub">Chrome • Edge • Playwright</div>
            </div>
            <div class="feature">
                <div class="feature-icon">💻</div>
                <div class="feature-text">CLI Tools</div>
                <div class="feature-sub">FFmpeg • yt-dlp • Pandoc</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div class="feature-text">Office</div>
                <div class="feature-sub">Word • Excel • PPT • WPS</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📡</div>
                <div class="feature-text">Protocols</div>
                <div class="feature-sub">MCP • A2A • REST</div>
            </div>
        </div>
    </div>
    
    <div class="badges">
        <span class="badge badge-mcp">⚡ MCP Native</span>
        <span class="badge">🤖 Claude Desktop Ready</span>
        <span class="badge">🌍 Global + China</span>
        <span class="badge badge-highlight">Open Source</span>
    </div>
</body>
</html>
