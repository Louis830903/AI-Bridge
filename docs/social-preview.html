<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI-Bridge Social Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1280px;
            height: 640px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
            position: relative;
        }
        
        /* Background decoration */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(244, 114, 182, 0.1) 0%, transparent 70%);
        }
        
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px;
        }
        
        .logo {
            font-size: 28px;
            font-family: 'Consolas', 'Monaco', monospace;
            color: #10b981;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        
        h1 {
            font-size: 72px;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #fff 0%, #10b981 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .tagline {
            font-size: 32px;
            color: #94a3b8;
            margin-bottom: 40px;
            font-weight: 300;
        }
        
        .features {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .feature {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px 30px;
            text-align: center;
        }
        
        .feature-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }
        
        .feature-text {
            font-size: 18px;
            color: #e2e8f0;
        }
        
        .feature-sub {
            font-size: 14px;
            color: #64748b;
            margin-top: 4px;
        }
        
        .badges {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 20px;
        }
        
        .badge {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 14px;
            color: #94a3b8;
        }
        
        .badge-highlight {
            background: linear-gradient(90deg, #10b981, #6366f1);
            border: none;
            color: white;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="content">
        <div class="logo">🌉 AI-BRIDGE</div>
        <h1>AI-Bridge</h1>
        <p class="tagline">The "USB-C" for AI Automation</p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">💬</div>
                <div class="feature-text">13 IM Platforms</div>
                <div class="feature-sub">Slack • Teams • Discord • Telegram • Feishu • DingTalk</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div class="feature-text">Office Suite</div>
                <div class="feature-sub">Word • Excel • PowerPoint • WPS</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🤖</div>
                <div class="feature-text">Any AI</div>
                <div class="feature-sub">Claude • GPT • Qwen • Gemini</div>
            </div>
        </div>
    </div>
    
    <div class="badges">
        <span class="badge">⚡ MCP Compatible</span>
        <span class="badge">🌍 Global + China</span>
        <span class="badge badge-highlight">Open Source</span>
    </div>
</body>
</html>
